<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instituto Perla del Ulúa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos Generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #fff5f7;
            color: #333;
        }

        /* Barra de Menú */
        nav {
            background-color: #3dbcea;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: inline-flex;
        }

        nav ul li {
            position: relative;
            margin: 0 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: rgb(14, 92, 218);
            font-weight: bold;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            top: 100%;
            left: 0;
            border-radius: 5px;
        }

        .dropdown-content a {
            color: #cd11c4;
            padding: 12px 16px;
            display: block;
            text-align: left;
            text-decoration: none;
        }

        nav ul li:hover .dropdown-content {
            display: block;
        }

        /* Portada con Logo */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(rgba(255, 133, 162, 0.2), rgba(255, 255, 255, 1));
        }

        .logo-escudo {
            width: 180px; /* Tamaño del logo */
            height: 180px;
            border-radius: 50%; /* Esto hace que la imagen se vea circular */
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            color: #d40fb6;
            margin: 0;
            font-family: 'Georgia', serif;
        }

        .hero p {
            font-size: 1.5rem;
            color: #e50ab2;
            font-style: italic;
            margin-top: 5px;
        }

        /* Formulario */
        .container {
            max-width: 500px;
            margin: 0 auto 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #fce4ec;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #d1103d;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #2b0db1;
        }

        .hidden { display: none; }
        label { font-weight: bold; color: #4a149c; display: block; margin-top: 15px; }

        /* Estilos sencillos para tus fotos sin alterar tu diseño */
        .seccion-fotos-nueva {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        .seccion-fotos-nueva img {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Estilos para los botones de contacto */
        .boton-red-social {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .color-wa { background-color: #25D366; }
        .color-fb { background-color: #1877F2; }

        /* ==========================================================================
           NUEVA ANIMACIÓN DETALLADA DE SASUKE CHIBI CON CORAZONES
           ========================================================================== */
        .contenedor-sasuke-3d {
            width: 100%;
            max-width: 400px;
            height: 250px;
            margin: 0 auto 25px auto;
            background: linear-gradient(135deg, #ffbcd3, #ffe3ec);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 600px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(244, 124, 148, 0.3);
            border: 3px solid #ff85a2;
        }

        /* Cartel de bienvenida renovado */
        .cartel-bienvenido {
            background-color: rgba(255, 255, 255, 0.9);
            color: #d81b60;
            padding: 5px 14px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 20px;
            border: 2px solid #ff85a2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            z-index: 10;
            animation: flotarCartel 2s ease-in-out infinite alternate;
        }

        /* Cuerpo Chibi de Sasuke */
        .sasuke-cuerpo {
            width: 55px;
            height: 85px;
            position: relative;
            transform-style: preserve-3d;
            animation: sasukeBailandoChibi 1s ease-in-out infinite alternate;
            z-index: 5;
        }

        /* Cabeza Chibi (Más grande que el cuerpo, como en las fotos) */
        .sasuke-cabeza {
            position: absolute;
            top: -46px;
            left: -10px;
            width: 75px;
            height: 60px;
            background-color: #fff0e1;
            border-radius: 50% 50% 45% 45%;
            z-index: 3;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.05);
        }

        /* Ojos grandes Chibi (Basados en las imágenes) */
        .sasuke-ojos-chibi {
            position: absolute;
            top: 22px;
            left: 10px;
            width: 18px;
            height: 22px;
            background-color: #121521;
            border-radius: 50%;
            /* Brillo blanco tierno dentro del ojo */
            box-shadow: inset -2px -2px 0px #fff, 38px 0px 0px #121521;
        }
        /* El segundo brillo del ojo derecho */
        .sasuke-ojos-chibi::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 40px;
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }

        /* Mejillas Rosadas (Blush de la foto 3) */
        .mejillas-rosadas {
            position: absolute;
            top: 38px;
            left: 5px;
            width: 10px;
            height: 6px;
            background-color: #f47c94;
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 55px 0 0 #f47c94;
        }

        /* Cabello spiky detallado */
        .sasuke-pelo {
            position: absolute;
            top: -60px;
            left: -16px;
            width: 88px;
            height: 75px;
            background-color: #101424;
            z-index: 2;
            clip-path: polygon(15% 90%, 0% 65%, 8% 45%, 22% 25%, 38% 8%, 50% 25%, 68% 5%, 85% 20%, 95% 45%, 100% 65%, 88% 90%, 70% 100%, 30% 100%);
        }

        /* Ropa Gris Lavanda (Fiel a los tonos de tus imágenes) */
        .sasuke-camisa {
            position: absolute;
            width: 100%;
            height: 45px;
            background-color: #b8bacf;
            border-radius: 4px;
            z-index: 2;
        }

        /* El cuello alto característico de Sasuke */
        .sasuke-cuello-alto {
            position: absolute;
            top: -12px;
            left: -4px;
            width: 63px;
            height: 16px;
            background-color: #a4a6bc;
            clip-path: polygon(0% 0%, 25% 100%, 75% 100%, 100% 0%, 85% 100%, 15% 100%);
            z-index: 4;
        }

        /* Faja/Cinta Morada (Detalle de las fotos 2 y 4) */
        .sasuke-faja {
            position: absolute;
            bottom: 5px;
            width: 100%;
            height: 14px;
            background-color: #504677; /* Falda oscura */
            border-top: 6px solid #8679b3; /* Lazo/Cinta morada */
            border-radius: 0 0 4px 4px;
            z-index: 3;
        }

        /* Piernas */
        .sasuke-piernas {
            position: absolute;
            bottom: -15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        .pierna-chibi {
            width: 14px;
            height: 18px;
            background-color: #ffffff;
            border-bottom: 5px solid #101424;
            animation: moverPiernasChibi 0.5s linear infinite alternate;
        }

        .pierna-chibi.der {
            animation-delay: 0.25s;
        }

        /* ==========================================================================
           SISTEMA DE CORAZONES FLOTANTES AL BAILAR
           ========================================================================== */
        .corazon-flotante {
            position: absolute;
            background-color: #ff4081;
            display: inline-block;
            width: 12px;
            height: 12px;
            transform: rotate(-45deg);
            opacity: 0;
            bottom: 30px;
            z-index: 1;
            animation: flotarCorazones 2.5s ease-in infinite;
        }

        .corazon-flotante::before,
        .corazon-flotante::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #ff4081;
            border-radius: 50%;
        }

        .corazon-flotante::before { top: -6px; left: 0; }
        .corazon-flotante::after { left: 6px; top: 0; }

        /* Variaciones de posiciones y tiempos para los corazones */
        .h1 { left: 25%; animation-delay: 0s; width: 14px; height: 14px; }
        .h2 { left: 40%; animation-delay: 0.6s; transform: rotate(-45deg) scale(0.8); background-color: #ff6b8b; }
        .h2::before, .h2::after { background-color: #06ef40; }
        .h3 { left: 60%; animation-delay: 1.2s; width: 16px; height: 16px; }
        .h4 { left: 75%; animation-delay: 1.8s; transform: rotate(-45deg) scale(0.7); }

        /* Keyframes de las animaciones */
        @keyframes flotarCartel {
            0% { transform: translateY(0) rotate(-1deg); }
            100% { transform: translateY(-4px) rotate(2deg); }
        }

        @keyframes sasukeBailandoChibi {
            0% { transform: rotateY(-10deg) rotateZ(-3deg) translateY(0); }
            100% { transform: rotateY(10deg) rotateZ(3deg) translateY(-5px); }
        }

        @keyframes moverPiernasChibi {
            0% { transform: scaleY(0.9) skewX(-4deg); }
            100% { transform: scaleY(1.1) skewX(4deg); }
        }

        @keyframes flotarCorazones {
            0% { transform: bottom: 30px; transform: rotate(-45deg) scale(0); opacity: 0; }
            30% { opacity: 0.8; }
            100% { bottom: 180px; transform: rotate(-45deg) scale(1.3) translateX(-15px); opacity: 0; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Inicio</a></li>
            <li>
                <a href="#">Académico ▾</a>
                <div class="dropdown-content">
                    <a href="#">Carreras</a>
                    <a href="#galeria">Galería</a>
                </div>
            </li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>

    <div class="hero">
        <img src="logo.jpeg" alt="Logo Instituto" class="logo-escudo">
        <h1>Instituto Perla del Ulúa</h1>
        <p>Progreso, Yoro</p>
    </div>

    <div class="container">
        <div id="step1">
            <h3 style="text-align:center; color:#ff85a2;">Bienvenido</h3>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <button onclick="mostrarCarreras()">Explorar Carreras</button>
        </div>

        <div id="step2" class="hidden">
            <h3 id="bienvenida" style="text-align:center; color:#d81b60;"></h3>
            
            <label>¿Qué carrera desea ver?</label>
            <select id="carrera" onchange="actualizarSecciones()">
                <option value="">-- Seleccione --</option>
                <option value="informatica">Informática</option>
                <option value="salud">Salud</option>
                <option value="finanzas">BTP en Finanzas</option>
            </select>

            <label>Jornada</label>
            <select id="jornada" onchange="actualizarSecciones()">
                <option value="matutina">Matutina</option>
                <option value="vespertina">Vespertina</option>
            </select>

            <label>Grado</label>
            <select id="grado">
                <option value="11">Onceavo</option>
                <option value="10">Décimo</option>
                <option value="12">Doceavo</option>
            </select>

            <label>Sección</label>
            <select id="seccion"></select>
        </div>
    </div>

    <div id="galeria" class="seccion-fotos-nueva">
        <h2 style="color: #d81b60; font-family: 'Georgia', serif; margin-bottom: 20px;">Galería</h2>
        
        <!-- SECCIÓN DE SASUKE RE-DISEÑADA CON DETALLES CHIBI Y CORAZONES -->
        <div class="contenedor-sasuke-3d">
            <div class="cartel-bienvenido">👋 ¡Bienvenido! 👋</div>
            
            <!-- Elementos de corazones flotantes -->
            <div class="corazon-flotante h1"></div>
            <div class="corazon-flotante h2"></div>
            <div class="corazon-flotante h3"></div>
            <div class="corazon-flotante h4"></div>

            <div class="sasuke-cuerpo">
                <div class="sasuke-pelo"></div>
                <div class="sasuke-cabeza">
                    <div class="sasuke-ojos-chibi"></div>
                    <div class="mejillas-rosadas"></div>
                </div>
                <div class="sasuke-camisa">
                    <div class="sasuke-cuello-alto"></div>
                    <div class="sasuke-faja"></div>
                </div>
                <div class="sasuke-piernas">
                    <div class="pierna-chibi izq"></div>
                    <div class="pierna-chibi der"></div>
                </div>
            </div>
        </div>

        <h3>Modulo 1</h3>
        <img src="modulo1.jpeg" alt="Módulo 1">

        <h3>Modulo 2</h3>
        <img src="modulo2.jpeg" alt="Módulo 2">

        <h3>Modulo 3</h3>
        <img src="modulo3.jpeg" alt="Módulo 3">

        <h3>Modulo 4</h3>
        <img src="modulo4.jpeg" alt="Módulo 4">

        <h3>Modulo 5</h3>
        <img src="modulo5.jpeg" alt="Módulo 5">

        <h2 style="color: #d81b60; font-family: 'Georgia', serif; margin-top: 40px; margin-bottom: 20px;">Fotos del Instituto</h2>
        <img src="fotoinst1.jpeg" alt="Instituto 1">
        <img src="fotoinst2.jpeg" alt="Instituto 2">
    </div>

    <div id="contacto" class="seccion-fotos-nueva">
        <h2 style="color: #d81b60; font-family: 'Georgia', serif; margin-bottom: 20px;">Contacto</h2>
        
        <a href="https://wa.me/96752974" class="boton-red-social color-wa" target="_blank">
            <i class="fab fa-whatsapp"></i> WhatsApp
        </a>

        <a href="https://www.facebook.com" class="boton-red-social color-fb" target="_blank">
            <i class="fab fa-facebook-f"></i> Facebook
        </a>
    </div>

    <script>
        function mostrarCarreras() {
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            if(nombre && correo) {
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('bienvenida').innerText = "Hola, " + nombre;
                actualizarSecciones();
            } else {
                alert("Por favor completa los datos para continuar.");
            }
        }

        function actualizarSecciones() {
            const carrera = document.getElementById('carrera').value;
            const jornada = document.getElementById('jornada').value;
            const seccionSelect = document.getElementById('seccion');
            
            seccionSelect.innerHTML = "";

            if (carrera === "informatica") {
                if (jornada === "vespertina") {
                    seccionSelect.options.add(new Option("Sección 1", "1"));
                    seccionSelect.options.add(new Option("Sección 2", "2"));
                } else {
                    seccionSelect.options.add(new Option("Sección 2", "2-m"));
                }
            } else {
                seccionSelect.options.add(new Option("Sección Única", "u"));
            }
        }
    </script>
</body>
</html>
